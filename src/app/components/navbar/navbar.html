<nav class="navbar navbar-expand-lg fixed-top bg-primary">
    <div class="container">
        <a class="navbar-brand fw-medium fst-italic" href="#">Alec Luí</a>
        <button
            class="navbar-toggler"
            type="button"
            aria-controls="navbarNav"
            [attr.aria-expanded]="navegacaoAberta()"
            [attr.aria-label]="textos[idioma.atual()].alternarNavegacao"
            (click)="alternarNavegacao()"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" [class.show]="navegacaoAberta()" id="navbarNav">
            <span class="ms-auto"></span>

            <ul class="navbar-nav">
                @for (item of itens; track $index) {
                <li class="nav-item">
                    <a class="nav-link fs-6" aria-current="page" [href]="item.url" (click)="fecharNavegacao()">
                        <i class="bi {{ item.icone }}"></i>
                        {{ item.titulo[idioma.atual()] }}
                    </a>}
            </ul>

            <div class="language-picker ms-lg-3 mt-2 mt-lg-0">
                <button
                    class="language-picker__trigger"
                    type="button"
                    (click)="alternarMenuIdioma()"
                    [attr.aria-expanded]="menuIdiomaAberto()"
                    aria-haspopup="listbox"
                    [attr.aria-label]="textos[idioma.atual()].selecionarIdioma"
                >
                    <svg class="language-picker__icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2v3m6 13h7m-3.5-4 4 8m-8 0 4-8" />
                    </svg>
                    <b>{{ idioma.atual().toUpperCase() }}</b>
                    <svg class="language-picker__chevron" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="m4 6 4 4 4-4" />
                    </svg>
                </button>

                <div class="language-picker__menu" role="listbox" [hidden]="!menuIdiomaAberto()">
                    <small>{{ textos[idioma.atual()].tituloMenuIdioma }}</small>
                    @for (opcaoIdioma of idiomas; track opcaoIdioma.codigo) {
                    <button
                        type="button"
                        role="option"
                        [attr.aria-selected]="idioma.atual() === opcaoIdioma.codigo"
                        (click)="selecionarIdioma(opcaoIdioma.codigo)"
                    >
                        <span>{{ opcaoIdioma.nome }}</span>
                        <b>{{ opcaoIdioma.codigo.toUpperCase() }}</b>
                    </button>
                    }
                </div>
            </div>
        </div>
    </div>
</nav>
